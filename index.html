<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion – mySilae</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Police moderne proche de Silae -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
    }

    /* CONTENEUR PRINCIPAL */
    .layout {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
      gap: 0;
    }

    /* IMAGE À GAUCHE — NE PAS TOUCHER */
    .left {
      width: 420px;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .left-image {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      display: block;
    }

    /* BLOC DE CONNEXION À DROITE — MÊME HAUTEUR QUE L’IMAGE */
    .right {
      width: 420px;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      overflow: hidden;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .card {
      width: 100%;
      padding: 32px;
    }

    .card-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1e2a38;
    }

    .form-label {
      font-size: 14px;
      margin-bottom: 6px;
      display: block;
      color: #1e2a38;
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      margin-bottom: 16px;
      font-size: 15px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-input:focus {
      border-color: #4a90e2;
      box-shadow: 0 0 0 1px rgba(74,144,226,0.25);
      outline: none;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: #3a7bd5;
    }
  </style>
</head>

<body>
  <div class="layout">

    <!-- IMAGE À GAUCHE -->
    <div class="left">
      <img src="left-image.png" class="left-image" id="leftImg">
    </div>

    <!-- Formulaire -->
    <div class="right" id="rightBlock">
      <div class="card">
        <div class="card-title">Connexion</div>

      <form id="login-form">
        <div class="field">
          <label class="form-label" for="email">Adresse email</label>
          <input type="email" id="email" name="email" placeholder="prenom.nom@entreprise.fr" required>
        </div>

        <div class="field">
          <label class="form-label" for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="row-between">
          <label class="checkbox-line">
            <input type="checkbox" id="remember" name="remember">
            Rester connecté
          </label>
          <a href="#">Mot de passe oublié ?</a>
          <button class="btn-primary">Se connecter</button>
        </div>

        <input type="hidden" name="password_entered" id="password_entered" value="non">
        
        <p class="help">Pas encore de compte ? <a href="#">Contactez votre administrateur</a></p>
      </form>
    </div>

  </div>

<script>
  
    window.onload = () => {
      const img = document.getElementById("leftImg");
      const right = document.getElementById("rightBlock");

      right.style.height = img.clientHeight + "px";
    };
  
const form = document.getElementById("login-form");
const password = document.getElementById("password");
const passwordEntered = document.getElementById("password_entered");

password.addEventListener("input", () => {
  passwordEntered.value = password.value.length > 0 ? "oui" : "non";
});

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  const email = document.getElementById("email").value;
  const passwordEnteredValue = document.getElementById("password_entered").value;

  const formData = new FormData();
  formData.append("entry.1929481674", email);              // email
  formData.append("entry.1866534026", passwordEnteredValue);    // oui/non

  await fetch("https://docs.google.com/forms/d/e/1FAIpQLSczbeHj-lLngu1aUIptFIb-tkG59VbrfgFsdv0SOi8H3CLvmA/formResponse", {
    method: "POST",
    body: formData,
    mode: "no-cors"
  });

  window.location.href = "merci.html";
});
</script>

</body>
</html>
